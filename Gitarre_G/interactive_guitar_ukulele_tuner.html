<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Präzisions Stimmgerät - Gitarre & Ukulele</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            wood: {
              800: '#2c1d11',
              900: '#1a0f0a',
              accent: '#d4a373'
            },
            tuned: '#10b981',
            flat: '#f59e0b',
            sharp: '#ef4444'
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at center, #231917 0%, #0d0806 100%);
    }
    
    .gauge-glow {
      filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.4));
    }

    .string-btn {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .string-btn.active {
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(212, 163, 115, 0.6);
      border-color: #d4a373;
    }

    .needle-transition {
      transition: transform 0.12s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
  </style>
</head>
<body class="h-full text-slate-100 flex flex-col justify-between selection:bg-amber-500 selection:text-black">

  <!-- HEADER / TOOLBAR -->
  <header class="w-full max-w-5xl mx-auto p-4 sm:p-6 flex justify-between items-center z-10">
    <div class="flex items-center gap-3">
      <div class="p-2.5 bg-amber-500/10 border border-amber-500/20 rounded-xl text-amber-500">
        <i data-lucide="music" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg sm:text-xl tracking-tight text-amber-100">Stimmgerät Pro</h1>
        <p class="text-xs text-amber-200/60">Gitarre & Ukulele Tuner</p>
      </div>
    </div>

    <!-- Right Actions -->
    <div class="flex items-center gap-2 sm:gap-3">
      <button id="fullscreenBtn" class="flex items-center gap-2 bg-slate-800/80 hover:bg-slate-700/80 text-amber-100/80 hover:text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium border border-slate-700/60 transition duration-200">
        <i data-lucide="maximize" id="fsIcon" class="w-4 h-4"></i>
        <span class="hidden sm:inline" id="fsText">Vollbild</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="w-full max-w-4xl mx-auto px-4 py-2 flex-1 flex flex-col justify-around items-center">

    <!-- INSTRUMENT & TUNING SELECTION ROW -->
    <div class="w-full flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-6 my-2">
      <!-- Instrument Selector -->
      <div class="flex bg-slate-900/80 p-1 rounded-2xl border border-slate-800 shadow-inner w-full sm:w-auto">
        <button id="btnGuitar" onclick="setInstrument('guitar')" class="flex-1 sm:flex-initial flex items-center justify-center gap-2 px-5 py-2 rounded-xl text-sm font-medium transition-all duration-200 bg-amber-500 text-slate-950 font-semibold shadow-md">
          <i data-lucide="guitar" class="w-4 h-4"></i>
          Gitarre
        </button>
        <button id="btnUkulele" onclick="setInstrument('ukulele')" class="flex-1 sm:flex-initial flex items-center justify-center gap-2 px-5 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-200 transition-all duration-200">
          <i data-lucide="music-2" class="w-4 h-4"></i>
          Ukulele
        </button>
      </div>

      <!-- Tuning Presets -->
      <div class="flex items-center gap-2 w-full sm:w-auto justify-center">
        <label for="tuningSelect" class="text-xs text-slate-400 font-medium">Stimmung:</label>
        <select id="tuningSelect" onchange="changeTuningPreset()" class="bg-slate-900/90 border border-slate-700/80 text-slate-200 text-xs sm:text-sm rounded-xl px-3 py-2 outline-none focus:border-amber-500 transition">
          <!-- Filled dynamically -->
        </select>
      </div>
    </div>

    <!-- MAIN TUNER VISUALIZER -->
    <div class="relative w-full max-w-md flex flex-col items-center my-4">

      <!-- Cent Meter Arch / Gauge Display -->
      <div id="gaugeContainer" class="relative w-full aspect-[2/1] max-w-[340px] flex items-end justify-center overflow-hidden">
        
        <!-- Background Scale Arc -->
        <svg class="w-full h-full transform translate-y-2" viewBox="0 0 200 100">
          <!-- Arc Lines -->
          <path d="M 20 90 A 80 80 0 0 1 180 90" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="2 3"/>
          
          <!-- Center In-Tune Range Marker -->
          <path d="M 92 12 A 80 80 0 0 1 108 12" fill="none" stroke="#10b981" stroke-width="6" class="opacity-80"/>

          <!-- Tick Marks -->
          <!-- -50 Cents -->
          <line x1="20" y1="90" x2="28" y2="85" stroke="#94a3b8" stroke-width="2"/>
          <!-- -25 Cents -->
          <line x1="48" y1="38" x2="54" y2="44" stroke="#64748b" stroke-width="1.5"/>
          <!-- 0 Cents (Center Perfect) -->
          <line x1="100" y1="10" x2="100" y2="20" stroke="#10b981" stroke-width="3"/>
          <!-- +25 Cents -->
          <line x1="152" y1="38" x2="146" y2="44" stroke="#64748b" stroke-width="1.5"/>
          <!-- +50 Cents -->
          <line x1="180" y1="90" x2="172" y2="85" stroke="#94a3b8" stroke-width="2"/>
        </svg>

        <!-- Needle -->
        <div id="needle" class="absolute bottom-2 left-1/2 w-1 h-32 sm:h-36 bg-slate-400 rounded-full origin-bottom needle-transition -translate-x-1/2 shadow-lg" style="transform: translateX(-50%) rotate(0deg);">
          <div class="w-3 h-3 bg-amber-400 rounded-full absolute -top-1 -left-1 shadow-md shadow-amber-500/50"></div>
        </div>

        <!-- Center Pivot Dot -->
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-1/2 w-8 h-8 bg-slate-800 border-2 border-slate-600 rounded-full z-10 flex items-center justify-center shadow-md">
          <div id="pivotDot" class="w-3 h-3 bg-slate-400 rounded-full transition-colors duration-200"></div>
        </div>
      </div>

      <!-- READOUT DISPLAY -->
      <div class="mt-6 text-center space-y-1">
        <div class="flex items-baseline justify-center gap-2">
          <!-- Detected Note Display -->
          <span id="noteDisplay" class="text-6xl sm:text-7xl font-extrabold tracking-tight text-slate-300 transition-colors duration-200">--</span>
          <span id="octaveDisplay" class="text-2xl font-bold text-slate-500"></span>
        </div>

        <!-- Status & Pitch Offset Text -->
        <div class="flex items-center justify-center gap-3 h-8">
          <span id="centsDisplay" class="text-sm font-semibold tracking-wide text-slate-400 bg-slate-900/80 px-3 py-1 rounded-full border border-slate-800">
            Mikrofon aus
          </span>
        </div>

        <!-- Frequency Readout -->
        <div id="freqDisplay" class="text-xs font-mono text-slate-500 tracking-wider">
          0.0 Hz
        </div>
      </div>

    </div>

    <!-- INTERACTIVE STRINGS PANEL (Tone Generator & Target Strings) -->
    <div class="w-full max-w-xl bg-slate-900/60 backdrop-blur-md rounded-2xl p-4 sm:p-6 border border-slate-800/80 shadow-xl my-2">
      <div class="flex justify-between items-center mb-3 px-1">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Saiten & Referenztöne</span>
        <span class="text-xs text-amber-400/80 flex items-center gap-1">
          <i data-lucide="volume-2" class="w-3.5 h-3.5"></i> Tippen zum Anhören
        </span>
      </div>

      <!-- Strings Container -->
      <div id="stringsContainer" class="flex justify-around items-center gap-2 sm:gap-4 py-2">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- MIC TOGGLE & CONTROL BAR -->
    <div class="my-2 flex flex-col items-center gap-2">
      <button id="micToggleBtn" onclick="toggleMicrophone()" class="group relative flex items-center gap-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold px-8 py-3.5 rounded-2xl shadow-lg shadow-amber-500/20 active:scale-95 transition-all duration-200">
        <i data-lucide="mic" id="micIcon" class="w-5 h-5"></i>
        <span id="micBtnText">Stimmgerät Starten</span>
      </button>
      <p id="micStatusSub" class="text-xs text-slate-500">Klicke, um den Mikrofon-Eingang zu aktivieren</p>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="w-full text-center py-3 text-xs text-slate-600 border-t border-slate-900/50">
    Echtzeit Pitch-Detection über Web Audio API &bull; Präzision &plusmn;1 Cent
  </footer>

  <script>
    /* ===================================================================
     * DATA STRUCTURES & TUNING PRESETS
     * =================================================================== */
    const INSTRUMENTS = {
      guitar: {
        name: 'Gitarre',
        presets: {
          standard: {
            name: 'Standard (E A D G B E)',
            strings: [
              { note: 'E', octave: 2, freq: 82.41, label: '6 - E' },
              { note: 'A', octave: 2, freq: 110.00, label: '5 - A' },
              { note: 'D', octave: 3, freq: 146.83, label: '4 - D' },
              { note: 'G', octave: 3, freq: 196.00, label: '3 - G' },
              { note: 'B', octave: 3, freq: 246.94, label: '2 - B' },
              { note: 'E', octave: 4, freq: 329.63, label: '1 - e' }
            ]
          },
          dropD: {
            name: 'Drop D (D A D G B E)',
            strings: [
              { note: 'D', octave: 2, freq: 73.42, label: '6 - D' },
              { note: 'A', octave: 2, freq: 110.00, label: '5 - A' },
              { note: 'D', octave: 3, freq: 146.83, label: '4 - D' },
              { note: 'G', octave: 3, freq: 196.00, label: '3 - G' },
              { note: 'B', octave: 3, freq: 246.94, label: '2 - B' },
              { note: 'E', octave: 4, freq: 329.63, label: '1 - e' }
            ]
          },
          halfStepDown: {
            name: 'Halbton Tiefer (Eb Ab Db Gb Bb Eb)',
            strings: [
              { note: 'D#', octave: 2, freq: 77.78, label: '6 - Eb' },
              { note: 'G#', octave: 2, freq: 103.83, label: '5 - Ab' },
              { note: 'C#', octave: 3, freq: 138.59, label: '4 - Db' },
              { note: 'F#', octave: 3, freq: 185.00, label: '3 - Gb' },
              { note: 'A#', octave: 3, freq: 233.08, label: '2 - Bb' },
              { note: 'D#', octave: 4, freq: 311.13, label: '1 - eb' }
            ]
          }
        }
      },
      ukulele: {
        name: 'Ukulele',
        presets: {
          standard: {
            name: 'Standard High-G (G C E A)',
            strings: [
              { note: 'G', octave: 4, freq: 392.00, label: '4 - G4' },
              { note: 'C', octave: 4, freq: 261.63, label: '3 - C4' },
              { note: 'E', octave: 4, freq: 329.63, label: '2 - E4' },
              { note: 'A', octave: 4, freq: 440.00, label: '1 - A4' }
            ]
          },
          lowG: {
            name: 'Low-G (G C E A)',
            strings: [
              { note: 'G', octave: 3, freq: 196.00, label: '4 - G3' },
              { note: 'C', octave: 4, freq: 261.63, label: '3 - C4' },
              { note: 'E', octave: 4, freq: 329.63, label: '2 - E4' },
              { note: 'A', octave: 4, freq: 440.00, label: '1 - A4' }
            ]
          },
          dDTuning: {
            name: 'D-Stimmung (A D F# B)',
            strings: [
              { note: 'A', octave: 4, freq: 440.00, label: '4 - A4' },
              { note: 'D', octave: 4, freq: 293.66, label: '3 - D4' },
              { note: 'F#', octave: 4, freq: 369.99, label: '2 - F#4' },
              { note: 'B', octave: 4, freq: 493.88, label: '1 - B4' }
            ]
          }
        }
      }
    };

    const NOTE_STRINGS = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    /* ===================================================================
     * APPLICATION STATE
     * =================================================================== */
    let currentInstrument = 'guitar';
    let currentTuningKey = 'standard';
    let selectedTargetString = null; // null = auto detect

    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let isListening = false;
    let animationFrameId = null;

    /* ===================================================================
     * INITIALIZATION & UI RENDERING
     * =================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      setupFullscreenToggle();
      updateTuningDropdown();
      renderStrings();
    });

    function setInstrument(type) {
      if (currentInstrument === type) return;
      currentInstrument = type;
      currentTuningKey = 'standard';
      selectedTargetString = null;

      // Update UI Tabs
      const btnGuitar = document.getElementById('btnGuitar');
      const btnUkulele = document.getElementById('btnUkulele');

      if (type === 'guitar') {
        btnGuitar.className = "flex-1 sm:flex-initial flex items-center justify-center gap-2 px-5 py-2 rounded-xl text-sm font-medium transition-all duration-200 bg-amber-500 text-slate-950 font-semibold shadow-md";
        btnUkulele.className = "flex-1 sm:flex-initial flex items-center justify-center gap-2 px-5 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-200 transition-all duration-200";
      } else {
        btnUkulele.className = "flex-1 sm:flex-initial flex items-center justify-center gap-2 px-5 py-2 rounded-xl text-sm font-medium transition-all duration-200 bg-amber-500 text-slate-950 font-semibold shadow-md";
        btnGuitar.className = "flex-1 sm:flex-initial flex items-center justify-center gap-2 px-5 py-2 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-200 transition-all duration-200";
      }

      updateTuningDropdown();
      renderStrings();
    }

    function updateTuningDropdown() {
      const select = document.getElementById('tuningSelect');
      select.innerHTML = '';
      const presets = INSTRUMENTS[currentInstrument].presets;
      for (const key in presets) {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = presets[key].name;
        select.appendChild(option);
      }
      select.value = currentTuningKey;
    }

    function changeTuningPreset() {
      const select = document.getElementById('tuningSelect');
      currentTuningKey = select.value;
      selectedTargetString = null;
      renderStrings();
    }

    function renderStrings() {
      const container = document.getElementById('stringsContainer');
      container.innerHTML = '';

      const strings = INSTRUMENTS[currentInstrument].presets[currentTuningKey].strings;

      strings.forEach((strObj, index) => {
        const isSelected = selectedTargetString === index;

        const btn = document.createElement('button');
        btn.className = `string-btn flex flex-col items-center justify-center w-12 h-16 sm:w-16 sm:h-20 rounded-2xl border ${
          isSelected 
            ? 'bg-amber-500/20 border-amber-500 text-amber-300 active' 
            : 'bg-slate-800/80 border-slate-700/70 text-slate-300 hover:border-slate-500'
        }`;

        btn.onclick = () => onStringClick(index, strObj.freq);

        btn.innerHTML = `
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">${strObj.label.split('-')[0]}</span>
          <span class="text-base sm:text-xl font-black">${strObj.note}</span>
          <span class="text-[10px] text-slate-500 font-mono">${strObj.freq.toFixed(0)}Hz</span>
        `;

        container.appendChild(btn);
      });
    }

    function onStringClick(index, freq) {
      // Toggle target selection
      if (selectedTargetString === index) {
        selectedTargetString = null;
      } else {
        selectedTargetString = index;
      }
      renderStrings();

      // Play synthesized reference string sound
      playSynthesizedString(freq);
    }

    /* ===================================================================
     * WEB AUDIO API - TONE GENERATOR (Plucked String Synthesizer)
     * =================================================================== */
    function playSynthesizedString(freq) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Fundamental Oscillator
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        // Harmonic Overtones for acoustic guitar simulation
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);

        osc2.type = 'sawtooth';
        osc2.frequency.setValueAtTime(freq * 2, ctx.currentTime);

        // Envelopes
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.8);

        gain2.gain.setValueAtTime(0, ctx.currentTime);
        gain2.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.01);
        gain2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8);

        osc.connect(gain);
        osc2.connect(gain2);

        gain.connect(ctx.destination);
        gain2.connect(ctx.destination);

        osc.start();
        osc2.start();
        osc.stop(ctx.currentTime + 1.8);
        osc2.stop(ctx.currentTime + 0.8);

      } catch (e) {
        console.error("Audio Context Playback Error:", e);
      }
    }

    /* ===================================================================
     * MICROPHONE & PITCH DETECTION (AUTOCORRELATION)
     * =================================================================== */
    async function toggleMicrophone() {
      if (isListening) {
        stopMicrophone();
      } else {
        await startMicrophone();
      }
    }

    async function startMicrophone() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const stream = await navigator.mediaDevices.getUserMedia({ 
          audio: { 
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          } 
        });

        micStream = stream;
        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;

        source.connect(analyser);

        isListening = true;
        updateMicBtnUI(true);

        // Start processing loop
        processPitch();

      } catch (err) {
        alert("Zugriff auf das Mikrofon fehlgeschlagen: " + err.message);
        console.error("Microphone Access Error:", err);
      }
    }

    function stopMicrophone() {
      isListening = false;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);

      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }

      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }

      updateMicBtnUI(false);
      resetReadout();
    }

    function updateMicBtnUI(active) {
      const btn = document.getElementById('micToggleBtn');
      const btnText = document.getElementById('micBtnText');
      const micIcon = document.getElementById('micIcon');
      const micStatusSub = document.getElementById('micStatusSub');

      if (active) {
        btn.className = "group relative flex items-center gap-3 bg-rose-600 hover:bg-rose-500 text-white font-bold px-8 py-3.5 rounded-2xl shadow-lg shadow-rose-600/30 active:scale-95 transition-all duration-200";
        btnText.textContent = "Stimmgerät Stoppen";
        micIcon.setAttribute('data-lucide', 'mic-off');
        micStatusSub.textContent = "Mikrofon ist aktiv. Spiele eine Saite an.";
      } else {
        btn.className = "group relative flex items-center gap-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold px-8 py-3.5 rounded-2xl shadow-lg shadow-amber-500/20 active:scale-95 transition-all duration-200";
        btnText.textContent = "Stimmgerät Starten";
        micIcon.setAttribute('data-lucide', 'mic');
        micStatusSub.textContent = "Klicke, um den Mikrofon-Eingang zu aktivieren";
      }
      lucide.createIcons();
    }

    function processPitch() {
      if (!isListening) return;

      const buffer = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(buffer);

      const pitch = autoCorrelate(buffer, audioCtx.sampleRate);

      if (pitch !== -1 && pitch > 50 && pitch < 1000) {
        // Valid frequency detected
        const noteNum = noteFromPitch(pitch);
        const noteName = NOTE_STRINGS[noteNum % 12];
        const octave = Math.floor(noteNum / 12) - 1;
        const cents = centsFromPitchAndNote(pitch, noteNum);

        updateGaugeAndReadout(pitch, noteName, octave, cents);
      } else {
        // Quiet / Undefined Signal
        smoothDecayReadout();
      }

      animationFrameId = requestAnimationFrame(processPitch);
    }

    /* Autocorrelation Pitch Detection Algorithm */
    function autoCorrelate(buf, sampleRate) {
      const SIZE = buf.length;
      let rms = 0;

      for (let i = 0; i < SIZE; i++) {
        const val = buf[i];
        rms += val * val;
      }
      rms = Math.sqrt(rms / SIZE);

      // Signal threshold to reduce ambient noise jitter
      if (rms < 0.01) return -1;

      let r1 = 0, r2 = SIZE - 1, thres = 0.2;
      for (let i = 0; i < SIZE / 2; i++) {
        if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      }
      for (let i = 1; i < SIZE / 2; i++) {
        if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
      }

      buf = buf.slice(r1, r2);
      const c = new Float32Array(buf.length);

      for (let i = 0; i < buf.length; i++) {
        for (let j = 0; j < buf.length - i; j++) {
          c[i] = c[i] + buf[j] * buf[j + i];
        }
      }

      let d = 0;
      while (c[d] > c[d + 1]) d++;

      let maxval = -1, maxpos = -1;
      for (let i = d; i < buf.length; i++) {
        if (c[i] > maxval) {
          maxval = c[i];
          maxpos = i;
        }
      }

      let T0 = maxpos;
      const x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
      const a = (x1 + x3 - 2 * x2) / 2;
      const b = (x3 - x1) / 2;
      if (a) T0 = T0 - b / (2 * a);

      return sampleRate / T0;
    }

    function noteFromPitch(frequency) {
      const noteNum = 12 * (Math.log(frequency / 440) / Math.log(2));
      return Math.round(noteNum) + 69;
    }

    function frequencyFromNoteNumber(note) {
      return 440 * Math.pow(2, (note - 69) / 12);
    }

    function centsFromPitchAndNote(frequency, note) {
      return Math.floor(1200 * Math.log(frequency / frequencyFromNoteNumber(note)) / Math.log(2));
    }

    /* ===================================================================
     * UI UPDATES & NEEDLE ANIMATION
     * =================================================================== */
    function updateGaugeAndReadout(freq, note, octave, cents) {
      const needle = document.getElementById('needle');
      const noteDisplay = document.getElementById('noteDisplay');
      const octaveDisplay = document.getElementById('octaveDisplay');
      const centsDisplay = document.getElementById('centsDisplay');
      const freqDisplay = document.getElementById('freqDisplay');
      const pivotDot = document.getElementById('pivotDot');

      // Clamp cents between -50 and +50
      const clampedCents = Math.max(-50, Math.min(50, cents));
      
      // Calculate Rotation Angle (-75 deg to +75 deg)
      const angle = (clampedCents / 50) * 75;
      needle.style.transform = `translateX(-50%) rotate(${angle}deg)`;

      // Text updates
      noteDisplay.textContent = note;
      octaveDisplay.textContent = octave;
      freqDisplay.textContent = `${freq.toFixed(1)} Hz`;

      // Status Styling based on Tuning Accuracy (±4 cents = In Tune)
      if (Math.abs(cents) <= 4) {
        // IN TUNE
        noteDisplay.className = "text-6xl sm:text-7xl font-extrabold tracking-tight text-emerald-400 gauge-glow transition-colors duration-150";
        centsDisplay.textContent = "Perfekt Gestimmt!";
        centsDisplay.className = "text-sm font-bold tracking-wide text-emerald-400 bg-emerald-950/80 px-4 py-1 rounded-full border border-emerald-500/40 shadow-lg shadow-emerald-500/20";
        pivotDot.className = "w-3 h-3 bg-emerald-400 rounded-full shadow-md shadow-emerald-400/80";
        needle.firstElementChild.className = "w-3 h-3 bg-emerald-400 rounded-full absolute -top-1 -left-1 shadow-md shadow-emerald-400/80";
      } else if (cents < -4) {
        // TOO LOW (FLAT)
        noteDisplay.className = "text-6xl sm:text-7xl font-extrabold tracking-tight text-amber-400 transition-colors duration-150";
        centsDisplay.textContent = `${cents} Cent (Zu tief)`;
        centsDisplay.className = "text-sm font-semibold tracking-wide text-amber-400 bg-amber-950/80 px-3 py-1 rounded-full border border-amber-500/30";
        pivotDot.className = "w-3 h-3 bg-amber-400 rounded-full";
        needle.firstElementChild.className = "w-3 h-3 bg-amber-400 rounded-full absolute -top-1 -left-1 shadow-md shadow-amber-400/50";
      } else {
        // TOO HIGH (SHARP)
        noteDisplay.className = "text-6xl sm:text-7xl font-extrabold tracking-tight text-rose-400 transition-colors duration-150";
        centsDisplay.textContent = `+${cents} Cent (Zu hoch)`;
        centsDisplay.className = "text-sm font-semibold tracking-wide text-rose-400 bg-rose-950/80 px-3 py-1 rounded-full border border-rose-500/30";
        pivotDot.className = "w-3 h-3 bg-rose-400 rounded-full";
        needle.firstElementChild.className = "w-3 h-3 bg-rose-400 rounded-full absolute -top-1 -left-1 shadow-md shadow-rose-400/50";
      }
    }

    function smoothDecayReadout() {
      // Keep displaying the last detected note, but return needle smoothly to center
      const needle = document.getElementById('needle');
      needle.style.transform = `translateX(-50%) rotate(0deg)`;
    }

    function resetReadout() {
      document.getElementById('needle').style.transform = `translateX(-50%) rotate(0deg)`;
      const noteDisplay = document.getElementById('noteDisplay');
      noteDisplay.textContent = "--";
      noteDisplay.className = "text-6xl sm:text-7xl font-extrabold tracking-tight text-slate-300";
      document.getElementById('octaveDisplay').textContent = "";
      
      const centsDisplay = document.getElementById('centsDisplay');
      centsDisplay.textContent = "Mikrofon aus";
      centsDisplay.className = "text-sm font-semibold tracking-wide text-slate-400 bg-slate-900/80 px-3 py-1 rounded-full border border-slate-800";
      
      document.getElementById('freqDisplay').textContent = "0.0 Hz";
      document.getElementById('pivotDot').className = "w-3 h-3 bg-slate-400 rounded-full";
    }

    /* ===================================================================
     * FULLSCREEN CONTROL
     * =================================================================== */
    function setupFullscreenToggle() {
      const fsBtn = document.getElementById('fullscreenBtn');
      const fsIcon = document.getElementById('fsIcon');
      const fsText = document.getElementById('fsText');

      fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            console.error(`Fullscreen request failed: ${err.message}`);
          });
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      });

      document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
          fsIcon.setAttribute('data-lucide', 'minimize');
          fsText.textContent = "Beenden";
        } else {
          fsIcon.setAttribute('data-lucide', 'maximize');
          fsText.textContent = "Vollbild";
        }
        lucide.createIcons();
      });
    }
  </script>
</body>
</html>
