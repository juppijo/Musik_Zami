<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handpan Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100d09; --metal1:#3a2f1f; --metal2:#8a6a2f; --gold:#d4af37;
  --text:#f2e6c4; --dim:#a99b78; --danger:#c0503f; --ok:#4c9a5a;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:'Barlow',sans-serif;overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
h1{font-family:'Bebas Neue',sans-serif;letter-spacing:3px;margin:0;font-size:clamp(22px,5vw,34px);color:var(--gold);}
button{font-family:'Barlow',sans-serif;font-weight:600;background:linear-gradient(180deg,var(--metal2),var(--metal1));
  color:var(--text);border:1px solid var(--gold);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px;}
button:hover{filter:brightness(1.15);}
button.active{background:var(--gold);color:#1a1508;}
input,select{font-family:'Barlow',sans-serif;background:#1c170f;color:var(--text);border:1px solid var(--metal2);
  border-radius:6px;padding:6px 8px;}
#app{max-width:1100px;margin:0 auto;padding:14px 16px 40px;}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
.controls{display:flex;gap:8px;}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
main{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;justify-content:center;}
#handpan{position:relative;width:min(86vw,460px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--metal2),var(--metal1) 60%,#000 100%);
  box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.6);flex-shrink:0;}
.pad{position:absolute;left:0;top:0;width:23%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%,#5a4a2a,#241c10 70%);
  box-shadow:0 6px 14px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;font-weight:700;
  cursor:pointer;transition:transform .08s,filter .08s;user-select:none;}
.pad.ding{width:30%;background:radial-gradient(circle at 35% 30%,#6a5730,#241c10 70%);}
.pad.active{transform:translate(-50%,-50%) scale(.9);filter:brightness(1.6);color:var(--gold);}
.pad.correct{box-shadow:0 0 0 4px var(--ok);}
.pad.wrong{box-shadow:0 0 0 4px var(--danger);}
#panel{flex:1;min-width:260px;max-width:420px;background:#17130c;border:1px solid var(--metal2);
  border-radius:12px;padding:16px;}
#panel h2{font-family:'Bebas Neue',sans-serif;color:var(--gold);letter-spacing:1px;margin-top:0;font-size:20px;}
.songitem,.melitem{display:flex;justify-content:space-between;align-items:center;gap:6px;
  background:#1c170f;border:1px solid #2a2214;border-radius:8px;padding:8px 10px;margin-bottom:8px;flex-wrap:wrap;}
.melitem .name{font-weight:700;color:var(--gold);flex:1;min-width:100px;}
.small{font-size:12px;color:var(--dim);}
.row{display:flex;gap:6px;flex-wrap:wrap;}
#score{font-size:15px;margin-top:10px;}
footer{text-align:center;color:var(--dim);font-size:12px;margin-top:24px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🪘 Handpan</h1>
    <div class="controls">
      <button id="styleBtn">🎨 Style</button>
      <button id="fsBtn">⛶ Vollbild</button>
    </div>
  </header>
  <nav class="modes">
    <button data-mode="free" class="active">Frei spielen</button>
    <button data-mode="learn">Lernen</button>
    <button data-mode="record">Aufnehmen</button>
    <button data-mode="library">Meine Melodien</button>
  </nav>
  <main>
    <div id="handpan"></div>
    <aside id="panel"></aside>
  </main>
  <footer>D-Kurd Skala · Tippe die Felder an oder nutze die Tasten A S D F G H J K L bzw. die Zahlen 1–9 (auch Ziffernblock)</footer>
</div>
<input type="file" id="fileInput" accept=".json" style="display:none">
<script>
const NOTES=[
 {id:0,name:'Ding',freq:146.83,note:'D3',key:'-',cx:50,cy:50,ding:true},
 {id:1,name:'A3',freq:220.00,note:'A3',key:'A',cx:0,cy:0},
 {id:2,name:'Bb3',freq:233.08,note:'Bb3',key:'S',cx:0,cy:0},
 {id:3,name:'C4',freq:261.63,note:'C4',key:'D',cx:0,cy:0},
 {id:4,name:'D4',freq:293.66,note:'D4',key:'F',cx:0,cy:0},
 {id:5,name:'E4',freq:329.63,note:'E4',key:'G',cx:0,cy:0},
 {id:6,name:'F4',freq:349.23,note:'F4',key:'H',cx:0,cy:0},
 {id:7,name:'G4',freq:392.00,note:'G4',key:'J',cx:0,cy:0},
 {id:8,name:'A4',freq:440.00,note:'A4',key:'K',cx:0,cy:0},
];
NOTES.slice(1).forEach((n,i)=>{
  const a=(i/8)*2*Math.PI - Math.PI/2;
  n.cx=50+Math.cos(a)*38; n.cy=50+Math.sin(a)*38;
});
const KEYMAP={}; NOTES.forEach(n=>{ if(n.key!=='-') KEYMAP[n.key]=n.id; });
NOTES.forEach(n=>{ KEYMAP[String(n.id+1)]=n.id; }); // Zahlen 1-9 (auch Ziffernblock)

const handpanEl=document.getElementById('handpan');
NOTES.forEach(n=>{
  const el=document.createElement('div');
  el.className='pad'+(n.ding?' ding':'');
  el.style.left=n.cx+'%'; el.style.top=n.cy+'%';
  el.textContent=n.note;
  el.dataset.id=n.id;
  el.addEventListener('mousedown',()=>hit(n.id,true));
  handpanEl.appendChild(el);
});
function padEl(id){return handpanEl.querySelector('.pad[data-id="'+id+'"]');}

let ctx=null;
function audio(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); return ctx;}
function playFreq(freq){
  const c=audio(); const t=c.currentTime;
  const g=c.createGain(); g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.5,t+.008);
  g.gain.exponentialRampToValueAtTime(.001,t+2.6);
  const o1=c.createOscillator(); o1.type='sine'; o1.frequency.value=freq;
  const o2=c.createOscillator(); o2.type='sine'; o2.frequency.value=freq*2.0;
  const g2=c.createGain(); g2.gain.setValueAtTime(.18,t); g2.gain.exponentialRampToValueAtTime(.001,t+.9);
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(c.destination);
  o1.start(t); o2.start(t); o1.stop(t+2.7); o2.stop(t+1);
}
function flash(id){ const el=padEl(id); el.classList.add('active'); setTimeout(()=>el.classList.remove('active'),150); }

let mode='free';
let recording=false, recStart=0, recNotes=[];
let learnSong=null, learnStep=0, learnAwaiting=false;

function hit(id,userAction){
  const n=NOTES.find(x=>x.id===id); playFreq(n.freq); flash(id);
  if(recording && userAction){ recNotes.push({i:id,t:Date.now()-recStart}); }
  if(mode==='learn' && learnAwaiting && userAction){ checkLearnStep(id); }
}
document.addEventListener('keydown',e=>{
  const k=e.key.toUpperCase(); if(KEYMAP[k]!==undefined) hit(KEYMAP[k],true);
});

// ---- Style / Theme ----
const THEMES=[
 {bg:'#100d09',metal1:'#3a2f1f',metal2:'#8a6a2f',gold:'#d4af37',text:'#f2e6c4'},
 {bg:'#150c08',metal1:'#3a1710',metal2:'#b5651d',gold:'#e08840',text:'#f5dcc0'},
 {bg:'#0a0d14',metal1:'#1c2534',metal2:'#7d8a99',gold:'#bcd4e6',text:'#e7eef5'},
];
let themeIdx=0;
function applyTheme(i){
  const t=THEMES[i]; const r=document.documentElement.style;
  r.setProperty('--bg',t.bg); r.setProperty('--metal1',t.metal1);
  r.setProperty('--metal2',t.metal2); r.setProperty('--gold',t.gold); r.setProperty('--text',t.text);
}
document.getElementById('styleBtn').addEventListener('click',()=>{
  themeIdx=(themeIdx+1)%THEMES.length; applyTheme(themeIdx);
});

// ---- Fullscreen ----
document.getElementById('fsBtn').addEventListener('click',()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
});

// ---- Modes / Panel ----
document.querySelectorAll('.modes button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); setMode(b.dataset.mode);
  });
});
function setMode(m){
  mode=m; recording=false; learnSong=null; learnAwaiting=false;
  NOTES.forEach(n=>padEl(n.id).classList.remove('correct','wrong'));
  render();
}
const panel=document.getElementById('panel');

function render(){
  if(mode==='free') panel.innerHTML='<h2>Frei spielen</h2><p class="small">Tippe die Klangfelder an oder nutze die Tastatur (A S D F G H J K L). Wechsle das Aussehen mit „🎨 Style“.</p>';
  else if(mode==='learn') renderLearn();
  else if(mode==='record') renderRecord();
  else if(mode==='library') renderLibrary();
}

// ---- Lernmodus ----
const SONGS=[
 {name:'Tonleiter aufwärts',seq:[1,2,3,4,5,6,7,8],tempo:550},
 {name:'Kleine Melodie',seq:[1,3,1,4,3,1,0],tempo:500},
 {name:'Regentropfen',seq:[5,3,1,3,5,7,5,1],tempo:420},
 {name:'Ruhiger Rhythmus',seq:[0,4,0,4,7,4,0],tempo:600},
];
function renderLearn(){
  let html='<h2>Lernen</h2><div class="row">';
  SONGS.forEach((s,i)=>{ html+='<button onclick="selectSong('+i+')">'+s.name+'</button>'; });
  html+='</div>';
  if(learnSong){
    html+='<p class="small">'+learnSong.name+' — '+learnSong.seq.length+' Töne</p>';
    html+='<div class="row"><button onclick="playDemo()">▶ Vorspielen</button><button onclick="startPractice()">🎯 Nachspielen</button></div>';
    html+='<div id="score"></div>';
  }
  panel.innerHTML=html;
}
function selectSong(i){ learnSong=SONGS[i]; learnStep=0; learnAwaiting=false; renderLearn(); }
function playDemo(){
  learnSong.seq.forEach((id,i)=>{ setTimeout(()=>hit(id,false), i*learnSong.tempo); });
}
function startPractice(){
  learnStep=0; learnAwaiting=true;
  NOTES.forEach(n=>padEl(n.id).classList.remove('correct','wrong'));
  document.getElementById('score').textContent='Ton 1 von '+learnSong.seq.length;
}
function checkLearnStep(id){
  const expected=learnSong.seq[learnStep];
  const el=padEl(id);
  if(id===expected){ el.classList.add('correct'); setTimeout(()=>el.classList.remove('correct'),400); learnStep++; }
  else { el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'),400); }
  const scoreEl=document.getElementById('score');
  if(learnStep>=learnSong.seq.length){ learnAwaiting=false; scoreEl.textContent='🎉 Geschafft! Melodie korrekt gespielt.'; }
  else if(scoreEl) scoreEl.textContent='Ton '+(learnStep+1)+' von '+learnSong.seq.length;
}

// ---- Aufnahme ----
function renderRecord(){
  let html='<h2>Aufnehmen</h2>';
  if(!recording){
    html+='<p class="small">Starte die Aufnahme und spiele deine Melodie auf dem Handpan.</p>';
    html+='<button onclick="startRec()">⏺ Aufnahme starten</button>';
  } else {
    html+='<p class="small">Aufnahme läuft… ('+recNotes.length+' Töne)</p>';
    html+='<button onclick="stopRec()">⏹ Stoppen</button>';
  }
  html+='<div id="saveArea"></div>';
  panel.innerHTML=html;
}
function startRec(){ recording=true; recNotes=[]; recStart=Date.now(); renderRecord(); }
function stopRec(){
  recording=false;
  const area=document.getElementById('saveArea');
  if(recNotes.length===0){ renderRecord(); return; }
  panel.innerHTML='<h2>Aufnehmen</h2><p class="small">'+recNotes.length+' Töne aufgenommen.</p>'+
    '<input id="melName" placeholder="Name der Melodie" style="width:100%;margin-bottom:8px;">'+
    '<div class="row"><button onclick="saveRecording()">💾 Speichern</button><button onclick="renderRecord()">Verwerfen</button></div>';
}
function saveRecording(){
  const name=document.getElementById('melName').value.trim()||'Unbenannte Melodie';
  const mel={name,notes:recNotes,created:Date.now()};
  const list=loadMelodies(); list.push(mel); localStorage.setItem('handpan_melodies',JSON.stringify(list));
  recNotes=[]; setMode('library');
  document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('active'));
  document.querySelector('.modes button[data-mode="library"]').classList.add('active');
}

// ---- Bibliothek ----
function loadMelodies(){ try{ return JSON.parse(localStorage.getItem('handpan_melodies')||'[]'); }catch(e){ return []; } }
function renderLibrary(){
  const list=loadMelodies();
  let html='<h2>Meine Melodien</h2>';
  html+='<div class="row" style="margin-bottom:10px;"><button onclick="document.getElementById(\'fileInput\').click()">📂 Datei laden</button></div>';
  if(list.length===0) html+='<p class="small">Noch keine gespeicherten Melodien.</p>';
  list.forEach((m,i)=>{
    html+='<div class="melitem"><span class="name">'+escapeHtml(m.name)+'</span>'+
      '<span class="small">'+m.notes.length+' Töne</span>'+
      '<div class="row">'+
      '<button onclick="playMelody('+i+')">▶</button>'+
      '<button onclick="exportMelody('+i+')">💾</button>'+
      '<button onclick="deleteMelody('+i+')">🗑</button>'+
      '</div></div>';
  });
  panel.innerHTML=html;
}
function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function playMelody(i){
  const m=loadMelodies()[i];
  m.notes.forEach(n=>{ setTimeout(()=>hit(n.i,false), n.t); });
}
function deleteMelody(i){
  const list=loadMelodies(); list.splice(i,1);
  localStorage.setItem('handpan_melodies',JSON.stringify(list)); renderLibrary();
}
function exportMelody(i){
  const m=loadMelodies()[i];
  const blob=new Blob([JSON.stringify(m,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=(m.name||'melodie').replace(/[^a-z0-9äöüß_-]+/gi,'_')+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
document.getElementById('fileInput').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const m=JSON.parse(ev.target.result);
      if(!m.notes||!Array.isArray(m.notes)) throw new Error('ungültig');
      const list=loadMelodies(); list.push({name:m.name||file.name,notes:m.notes,created:Date.now()});
      localStorage.setItem('handpan_melodies',JSON.stringify(list)); renderLibrary();
    }catch(err){ alert('Datei konnte nicht gelesen werden: ungültiges Format.'); }
  };
  reader.readAsText(file); e.target.value='';
});

render();
</script>
</body>
</html>
