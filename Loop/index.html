<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>LOOP MATRIX — Audio Looper</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="theme-dark color-neon">

  <!-- Background light-sound canvas -->
  <canvas id="bgCanvas"></canvas>

  <!-- HEADER -->
  <header id="header">
    <div class="logo">
      <svg class="logo-gem" viewBox="0 0 32 32" width="28" height="28">
        <polygon points="16,2 28,10 28,22 16,30 4,22 4,10" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <polygon points="16,6 24,12 24,20 16,26 8,20 8,12" fill="currentColor" opacity="0.2"/>
        <line x1="16" y1="2" x2="16" y2="30" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
        <line x1="4" y1="10" x2="28" y2="22" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
        <line x1="28" y1="10" x2="4" y2="22" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
      </svg>
      <span class="logo-text">LOOP<span class="accent">MATRIX</span></span>
      <span class="logo-version">v1.0</span>
    </div>

    <div class="header-center">
      <div class="master-vol-inline">
        <svg viewBox="0 0 20 20" width="14" height="14" fill="currentColor" opacity="0.5">
          <path d="M3 7h4l5-4v14l-5-4H3V7zm10.5 1.5a3 3 0 0 1 0 3M14 5a6 6 0 0 1 0 10"/>
        </svg>
        <input type="range" id="masterVolume" min="0" max="1" step="0.01" value="0.8" title="Master Volume">
      </div>
      <div class="bpm-display">
        <span class="bpm-label">BPM</span>
        <input type="number" id="bpmInput" min="40" max="240" value="120">
      </div>
      <button id="playAllBtn" class="hdr-action-btn play">▶ ALLE</button>
      <button id="stopAllBtn" class="hdr-action-btn stop">■ STOP</button>
    </div>

    <div class="header-controls">
      <div class="color-palette">
        <button class="color-dot active" data-color="neon"   title="Neon Grün"   style="background:#00ff88"></button>
        <button class="color-dot"        data-color="cyber"  title="Cyber Blau"  style="background:#00d4ff"></button>
        <button class="color-dot"        data-color="plasma" title="Plasma Lila" style="background:#bf00ff"></button>
        <button class="color-dot"        data-color="solar"  title="Solar Orange"style="background:#ff8800"></button>
        <button class="color-dot"        data-color="rose"   title="Rose Pink"   style="background:#ff0066"></button>
      </div>
      <div class="icon-btn-group">
        <button class="icon-btn active" id="lightSoundBtn" title="Licht-Sound Effekt">✦</button>
        <button class="icon-btn"        id="darkModeBtn"   title="Hell / Dunkel">◑</button>
        <button class="icon-btn"        id="saveSessionBtn"  title="Session speichern">↓</button>
        <button class="icon-btn"        id="loadSessionBtn"  title="Session laden">↑</button>
        <button class="icon-btn"        id="fullscreenBtn"   title="Vollbild">⛶</button>
      </div>
      <input type="file" id="sessionFileInput" accept=".json" style="display:none">
    </div>
  </header>

  <!-- SPECTRUM ANALYZER -->
  <section id="spectrumBar">
    <canvas id="spectrumCanvas"></canvas>
    <div id="spectrumGhost"></div>
  </section>

  <!-- LOOP GRID -->
  <main id="loopGrid">
    <!-- Generated by script.js -->
  </main>

  <!-- TOAST -->
  <div id="toast" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
