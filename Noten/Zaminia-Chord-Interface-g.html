<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Zaminia MIDI Creator</title>
    <style>
        body { background: #0f172a; color: #38bdf8; font-family: 'Courier New', monospace; text-align: center; padding: 40px; }
        .chord-btn { 
            background: #1e293b; border: 1px solid #38bdf8; color: #f8fafc;
            padding: 15px 25px; margin: 8px; cursor: pointer; border-radius: 4px;
            font-size: 1rem; transition: all 0.2s;
        }
        .chord-btn:hover { background: #38bdf8; color: #0f172a; box-shadow: 0 0 15px #38bdf8; }
        
        .action-btn { border: none; padding: 15px 25px; color: white; margin: 15px 5px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .export-btn { background: #10b981; }
        .export-btn:hover { background: #059669; }
        .reset-btn { background: #ef4444; }
        .reset-btn:hover { background: #dc2626; }

        #sequence-display {
            background: #1e293b;
            border: 1px dashed #38bdf8;
            border-radius: 6px;
            padding: 15px;
            margin: 20px auto;
            max-width: 600px;
            min-height: 24px;
            color: #f8fafc;
            font-size: 1.1rem;
        }

        #status { margin-top: 10px; font-style: italic; color: #94a3b8; }
    </style>
</head>
<body>

    <h1>ZAMINIA MIDI ENGINE</h1>
    <p>Klicke auf die Akkorde, um eine Sequenz zu erstellen.</p>

    <div id="controls">
        <button class="chord-btn" onclick="addChord([60, 64, 67, 71], 'C Maj7')">C Maj7</button>
        <button class="chord-btn" onclick="addChord([57, 60, 64, 67], 'A min7')">A min7</button>
        <button class="chord-btn" onclick="addChord([53, 57, 60, 64], 'F Maj7')">F Maj7</button>
        <button class="chord-btn" onclick="addChord([55, 59, 62, 65], 'G7')">G7 Dominant</button>
    </div>

    <div id="sequence-display">Keine Akkorde ausgewählt</div>

    <div>
        <button class="action-btn export-btn" onclick="downloadMIDI()">⬇ MIDI DATEI HERUNTERLADEN</button>
        <button class="action-btn reset-btn" onclick="resetSequence()">🔄 SEQUENZ ZURÜCKSETZEN</button>
    </div>
    
    <div id="status">Bisher 0 Akkorde in der Sequenz.</div>

    <script>
        // Web Audio API für Sound-Ausgabe ohne externe Bibliotheken
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        let chordHistory = [];
        let midiSequence = []; // Speichert die MIDI-Notennummern

        function playNotes(midiNotes) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            midiNotes.forEach(note => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                // Umrechnung MIDI Note in Frequenz (Hz)
                const freq = 440 * Math.pow(2, (note - 69) / 12);
                osc.frequency.value = freq;
                osc.type = 'triangle';

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 1.2);
            });
        }

        function addChord(midiNotes, name) {
            playNotes(midiNotes);
            chordHistory.push(name);
            midiSequence.push(midiNotes);
            updateUI();
        }

        function updateUI() {
            const display = document.getElementById('sequence-display');
            const status = document.getElementById('status');

            if (chordHistory.length === 0) {
                display.innerText = "Keine Akkorde ausgewählt";
                status.innerText = "Bisher 0 Akkorde in der Sequenz.";
            } else {
                display.innerText = chordHistory.join(' ➔ ');
                status.innerText = `Letzter Akkord: ${chordHistory[chordHistory.length - 1]} | Gesamtlänge: ${chordHistory.length} Akkord(e)`;
            }
        }

        function resetSequence() {
            chordHistory = [];
            midiSequence = [];
            updateUI();
        }

        // Native MIDI-Generator-Funktion
        function buildMidiBytes(sequence) {
            const header = [0x4D, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, 0x01, 0xE0];
            let trackData = [];

            sequence.forEach(chord => {
                // Note-On Event für alle Töne im Akkord
                chord.forEach((note, index) => {
                    const deltaTime = index === 0 ? [0x00] : [0x00];
                    trackData.push(...deltaTime, 0x90, note, 0x64);
                });

                // Note-Off Event nach halber Note Dauer (480 Ticks)
                chord.forEach((note, index) => {
                    const deltaTime = index === 0 ? [0x83, 0x60] : [0x00]; // Delta Time 480
                    trackData.push(...deltaTime, 0x80, note, 0x40);
                });
            });

            // End of Track Event
            trackData.push(0x00, 0xFF, 0x2F, 0x00);

            const trackLength = trackData.length;
            const trackHeader = [
                0x4D, 0x54, 0x72, 0x6B,
                (trackLength >> 24) & 0xFF,
                (trackLength >> 16) & 0xFF,
                (trackLength >> 8) & 0xFF,
                trackLength & 0xFF
            ];

            return new Uint8Array([...header, ...trackHeader, ...trackData]);
        }

        function downloadMIDI() {
            if (chordHistory.length === 0) {
                alert("Spiel erst ein paar Akkorde!");
                return;
            }

            const midiData = buildMidiBytes(midiSequence);
            const blob = new Blob([midiData], { type: 'audio/midi' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'zaminia_composition.mid';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            document.getElementById('status').innerText = "MIDI-Datei erfolgreich generiert und heruntergeladen!";
        }
    </script>
</body>
</html>
