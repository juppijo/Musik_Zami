<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Zaminia MIDI Engine</title>
    <style>
        body { 
            background: #0f172a; 
            color: #38bdf8; 
            font-family: 'Courier New', monospace; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
            box-sizing: border-box;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto 10px auto;
        }

        h1 { margin: 0; font-size: 1.8rem; }

        .fullscreen-btn {
            background: #334155;
            border: 1px solid #38bdf8;
            color: #f8fafc;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
        }
        .fullscreen-btn:hover { background: #38bdf8; color: #0f172a; }

        .section-title {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chord-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
            margin: 10px auto;
        }

        .chord-btn { 
            background: #1e293b; 
            border: 1px solid #38bdf8; 
            color: #f8fafc;
            padding: 12px 20px; 
            margin: 6px; 
            cursor: pointer; 
            border-radius: 4px;
            font-size: 0.95rem; 
            transition: all 0.2s;
            flex: 1 1 140px;
            max-width: 180px;
        }
        .chord-btn:hover { 
            background: #38bdf8; 
            color: #0f172a; 
            box-shadow: 0 0 12px #38bdf8; 
        }

        .preset-btn {
            background: #0284c7;
            border: none;
            color: white;
            padding: 8px 14px;
            margin: 4px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .preset-btn:hover { background: #0369a1; }

        .action-btn { 
            border: none; 
            padding: 14px 22px; 
            color: white; 
            margin: 15px 5px; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 4px; 
        }
        .export-btn { background: #10b981; }
        .export-btn:hover { background: #059669; }
        .reset-btn { background: #ef4444; }
        .reset-btn:hover { background: #dc2626; }

        #sequence-display {
            background: #1e293b;
            border: 1px dashed #38bdf8;
            border-radius: 6px;
            padding: 15px;
            margin: 15px auto;
            max-width: 800px;
            min-height: 24px;
            color: #f8fafc;
            font-size: 1.1rem;
            word-wrap: break-word;
        }

        #status { margin-top: 5px; font-style: italic; color: #94a3b8; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>ZAMINIA MIDI ENGINE</h1>
        <button class="fullscreen-btn" onclick="toggleFullScreen()">⛶ Vollbild</button>
    </div>

    <!-- Empfohlene Progressionen -->
    <div class="section-title">Inspiration: Vorschläge laden</div>
    <div>
        <button class="preset-btn" onclick="loadPreset('pop')">✨ Pop / Emotional (C - Am - F - G)</button>
        <button class="preset-btn" onclick="loadPreset('jazz')">🎷 Jazz / Impressionistisch (C Maj7 - Am7 - Dm7 - G7)</button>
    </div>

    <!-- Akkorde Auswahl -->
    <div class="section-title">Akkorde wählen</div>
    <div class="chord-grid">
        <button class="chord-btn" onclick="addChord([60, 64, 67, 71], 'C Maj7')">C Maj7</button>
        <button class="chord-btn" onclick="addChord([57, 60, 64, 67], 'A min7')">A min7</button>
        <button class="chord-btn" onclick="addChord([53, 57, 60, 64], 'F Maj7')">F Maj7</button>
        <button class="chord-btn" onclick="addChord([55, 59, 62, 65], 'G7')">G7 Dominant</button>

        <button class="chord-btn" onclick="addChord([52, 55, 59, 62], 'E min7')">E min7</button>
        <button class="chord-btn" onclick="addChord([50, 53, 57, 60], 'D min7')">D min7</button>
        <button class="chord-btn" onclick="addChord([52, 56, 59, 62], 'E7')">E7 (Spannung)</button>
        <button class="chord-btn" onclick="addChord([50, 54, 57, 60], 'D7')">D7</button>
        <button class="chord-btn" onclick="addChord([58, 62, 65, 69], 'Bb Maj7')">Bb Maj7 (Traum)</button>
    </div>

    <div class="section-title">Bisherige Sequenz</div>
    <div id="sequence-display">Keine Akkorde ausgewählt</div>

    <div>
        <button class="action-btn export-btn" onclick="downloadMIDI()">⬇ MIDI DATEI HERUNTERLADEN</button>
        <button class="action-btn reset-btn" onclick="resetSequence()">🔄 SEQUENZ ZURÜCKSETZEN</button>
    </div>
    
    <div id="status">Bisher 0 Akkorde in der Sequenz.</div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let chordHistory = [];
        let midiSequence = [];

        function playNotes(midiNotes) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            midiNotes.forEach(note => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                const freq = 440 * Math.pow(2, (note - 69) / 12);
                osc.frequency.value = freq;
                osc.type = 'triangle';

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 1.2);
            });
        }

        function addChord(midiNotes, name) {
            playNotes(midiNotes);
            chordHistory.push(name);
            midiSequence.push(midiNotes);
            updateUI();
        }

        function updateUI() {
            const display = document.getElementById('sequence-display');
            const status = document.getElementById('status');

            if (chordHistory.length === 0) {
                display.innerText = "Keine Akkorde ausgewählt";
                status.innerText = "Bisher 0 Akkorde in der Sequenz.";
            } else {
                display.innerText = chordHistory.join(' ➔ ');
                status.innerText = `Letzter Akkord: ${chordHistory[chordHistory.length - 1]} | Gesamtlänge: ${chordHistory.length} Akkord(e)`;
            }
        }

        function resetSequence() {
            chordHistory = [];
            midiSequence = [];
            updateUI();
        }

        // Vorlagen/Presets laden
        function loadPreset(type) {
            resetSequence();
            if (type === 'pop') {
                addChord([60, 64, 67, 71], 'C Maj7');
                addChord([57, 60, 64, 67], 'A min7');
                addChord([53, 57, 60, 64], 'F Maj7');
                addChord([55, 59, 62, 65], 'G7');
            } else if (type === 'jazz') {
                addChord([60, 64, 67, 71], 'C Maj7');
                addChord([57, 60, 64, 67], 'A min7');
                addChord([50, 53, 57, 60], 'D min7');
                addChord([55, 59, 62, 65], 'G7');
            }
        }

        // Vollbild Funktion
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Fehler beim Aktivieren von Vollbild: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Native MIDI-Generator-Funktion
        function buildMidiBytes(sequence) {
            const header = [0x4D, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, 0x01, 0xE0];
            let trackData = [];

            sequence.forEach(chord => {
                chord.forEach((note, index) => {
                    trackData.push(0x00, 0x90, note, 0x64);
                });

                chord.forEach((note, index) => {
                    const deltaTime = index === 0 ? [0x83, 0x60] : [0x00];
                    trackData.push(...deltaTime, 0x80, note, 0x40);
                });
            });

            trackData.push(0x00, 0xFF, 0x2F, 0x00);

            const trackLength = trackData.length;
            const trackHeader = [
                0x4D, 0x54, 0x72, 0x6B,
                (trackLength >> 24) & 0xFF,
                (trackLength >> 16) & 0xFF,
                (trackLength >> 8) & 0xFF,
                trackLength & 0xFF
            ];

            return new Uint8Array([...header, ...trackHeader, ...trackData]);
        }

        function downloadMIDI() {
            if (chordHistory.length === 0) {
                alert("Spiel erst ein paar Akkorde!");
                return;
            }

            const midiData = buildMidiBytes(midiSequence);
            const blob = new Blob([midiData], { type: 'audio/midi' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'zaminia_composition.mid';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            document.getElementById('status').innerText = "MIDI-Datei erfolgreich generiert und heruntergeladen!";
        }
    </script>
</body>
</html>
